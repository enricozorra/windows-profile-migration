# Static CRT for MSVC builds so the binary has no VC++ redistributable
# dependency on the target machine. The GNU target links the system msvcrt.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
