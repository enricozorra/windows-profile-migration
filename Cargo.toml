[package]
name = "profmig"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "In-place Windows user profile re-mapping to a new account SID (Local -> AD, Domain A -> Domain B)"
license = "MIT"
repository = "https://github.com/enricozorra/windows-profile-migration"
publish = false

[[bin]]
name = "profmig"
path = "src/main.rs"

# Win32 bindings only. windows-sys is raw FFI with no runtime, which keeps the
# binary self-contained; every call is wrapped in src/win/ so the rest of the
# crate stays safe and platform-neutral.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.59.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_NetworkManagement_NetManagement",
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
